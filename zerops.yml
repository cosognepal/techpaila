zerops:
  - setup: nodejs
    build:
      base: nodejs@24
      buildCommands:
        - npm install
        - npm run build
      deployFiles: .
    run:
      base: nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      start: npm start
      envVariables:
        S3_ENDPOINT: ${storage_apiUrl}
        S3_BUCKET: ${storage_bucketName}
        S3_KEY: ${storage_accessKeyId}
        S3_SECRET: ${storage_secretAccessKey}
        S3_REGION: us-east-1
